# Testing System, imported from the Web Fuzzing Dataset by tools/import-wfd.py.
# Regenerate rather than edit: tools/import-wfd.py testing-system
name: rd-testing-system
x-dataset:
  id: testing-system
  title: Testing System
  origin:
    dataset: wfd
    repository: https://github.com/WebFuzzing/Dataset
    commit: b666555842a4547d46026349147a2b8159ee5835
    path: jdk_21_maven/cs/rest/testing-system
  upstream:
    repository: https://github.com/mirodilkamilov/testing-system
    license: MIT
  language: jvm
  service: sut-testing-system
  port: 8080
  document: openapi.json
  basePath: /api
  documentServedAt: /api/v3/api-docs
  ready: /api/v3/api-docs
  auth:
    file: auth.yaml
    user: WfdAdmin1
    server: null
  leaveAlone:
    - operation: logout
      why: ends the session the login opened
  coverage:
    kind: jacoco-tcpserver
    port: 6300
  platforms:
    - linux/amd64
    - linux/arm64
services:
  db:
    environment:
      POSTGRES_DB: testing_system
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U root -d testing_system
      timeout: 30s
      interval: 30s
      retries: 3
    image: postgres:17.2@sha256:3267c505060a0052e5aa6e5175a7b41ab6b04da2f8c4540fc6e98a37210aa2d3
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - type: bind
        source: ./files/01_create_tables.sql
        target: /docker-entrypoint-initdb.d/01_create_tables.sql
      - type: bind
        source: ./files/02_insert_data.sql
        target: /docker-entrypoint-initdb.d/02_insert_data.sql
  redis:
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping
      timeout: 30s
      interval: 30s
      retries: 3
    image: redis:7.4@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
  sut-testing-system:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_PORT: "8081"
    image: webfuzzing/wfd-testing-system:FINAL@sha256:311f513cfd265b2887b366be5ec74640821f65960b1b6d25bc5eea5de6083e2e
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::6300"
