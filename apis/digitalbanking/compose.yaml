# Digital Banking, imported from the Web Fuzzing Dataset by tools/import-wfd.py.
# Regenerate rather than edit: tools/import-wfd.py digitalbanking
name: rd-digitalbanking
x-dataset:
  id: digitalbanking
  title: Digital Banking
  origin:
    dataset: wfd
    repository: https://github.com/WebFuzzing/Dataset
    commit: b666555842a4547d46026349147a2b8159ee5835
    path: jdk_17_maven/cs/rest/digitalbanking
  upstream:
    repository: https://github.com/jphaugla/Redisearch-Digital-Banking-redisTemplate
    license: not-known license
  language: jvm
  service: sut-digitalbanking
  port: 8080
  document: openapi.json
  basePath: ""
  documentServedAt: /v3/api-docs
  ready: /v3/api-docs
  auth: null
  leaveAlone: []
  coverage:
    kind: jacoco-tcpserver
    port: 6300
  platforms:
    - linux/amd64
    - linux/arm64
services:
  cassandra:
    environment:
      CASSANDRA_CLUSTER_NAME: test
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    healthcheck:
      test:
        - CMD-SHELL
        - "cqlsh -e \"CREATE KEYSPACE IF NOT EXISTS banking WITH replication = {'class':'SimpleStrategy','replication_factor':1};CREATE TABLE IF NOT EXISTS banking.transaction (tranid text, accountno text, amounttype text, merchant text, referencekeytype text, referencekeyvalue text, originalamount text, amount text, trancd text, description text, initialdate text, settlementdate text, postingdate text, status text, disputeid text, transactionreturn text, location text, transactiontags text, primary key (tranid));\""
      timeout: 30s
      interval: 30s
      retries: 3
    image: cassandra:4.1@sha256:25f6a4d5c258fa7295cb4f4ccd7d94a21e565a1040ba1c205455fc11ff8041fc
  db:
    environment:
      REDIS_ARGS: --requirepass jasonrocks
    healthcheck:
      test:
        - CMD-SHELL
        - "redis-cli -a jasonrocks ping | grep PONG"
      timeout: 30s
      interval: 30s
      retries: 3
    image: redis/redis-stack-server:7.4.0-v1@sha256:72035434f455ecd897090d3dd83ec357d34857287f159378b965a7006312a797
  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_NODE_ID: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    image: apache/kafka:3.8.1@sha256:22c4bea38875408e8f9fe52aca8e3a6ee67f9aa0090db59af99a2f6647558db5
  sut-digitalbanking:
    depends_on:
      cassandra:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      AUTH_PORT: "8081"
    image: webfuzzing/wfd-digitalbanking:FINAL@sha256:cf5a36b870862ab912aa56e91c31ad36a91f7c024c900092c3301e6408829da8
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::6300"
