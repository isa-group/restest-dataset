# Blog, imported from the Web Fuzzing Dataset by tools/import-wfd.py.
# Regenerate rather than edit: tools/import-wfd.py blogapi
name: rd-blogapi
x-dataset:
  id: blogapi
  title: Blog
  origin:
    dataset: wfd
    repository: https://github.com/WebFuzzing/Dataset
    commit: b666555842a4547d46026349147a2b8159ee5835
    path: jdk_8_maven/cs/rest/original/blogapi
  upstream:
    repository: https://github.com/osopromadze/Spring-Boot-Blog-REST-API
    license: AGPL
  language: jvm
  service: sut-blogapi
  port: 8080
  document: openapi.json
  basePath: ""
  documentServedAt: /blogapi.json
  ready: /blogapi.json
  auth:
    file: auth.yaml
    user: admin
    server: null
  leaveAlone: []
  coverage:
    kind: jacoco-tcpserver
    port: 6300
  platforms:
    - linux/amd64
    - linux/arm64
services:
  db:
    environment:
      MYSQL_DATABASE: blogapi
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      timeout: 30s
      interval: 30s
      retries: 3
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    tmpfs:
      - /var/lib/mysql
    volumes:
      - type: bind
        source: ./files/blogapi.sql
        target: /docker-entrypoint-initdb.d/blogapi.sql
      - type: bind
        source: ./files/data.sql
        target: /docker-entrypoint-initdb.d/data.sql
  sut-blogapi:
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_PORT: "8081"
    image: webfuzzing/wfd-blogapi:FINAL@sha256:f90fd39bed6aa6c299daa30abadd3010ed3d39c6e91b693de0da0b45ba2ba0b4
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::6300"
