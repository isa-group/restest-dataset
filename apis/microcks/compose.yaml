# Microcks, imported from the Web Fuzzing Dataset by tools/import-wfd.py.
# Regenerate rather than edit: tools/import-wfd.py microcks
name: rd-microcks
x-dataset:
  id: microcks
  title: Microcks
  origin:
    dataset: wfd
    repository: https://github.com/WebFuzzing/Dataset
    commit: b666555842a4547d46026349147a2b8159ee5835
    path: jdk_21_maven/cs/rest-gui/microcks
  upstream:
    repository: https://github.com/microcks/microcks
    license: Apache
  language: jvm
  service: sut-microcks
  port: 8080
  document: openapi.json
  basePath: ""
  documentServedAt: /v3/api-docs
  ready: /v3/api-docs
  auth:
    file: auth.yaml
    user: "\"ADMIN_1\""
    restest: []
    login: true
  coverage:
    kind: jacoco-tcpserver
    port: 6300
  platforms:
    - linux/amd64
    - linux/arm64
services:
  keycloak:
    command:
      - start-dev
      - --hostname=http://localhost:8081
      - --import-realm
      - --health-enabled=true
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "echo -e 'GET /health/live HTTP/1.1\r\nHost: localhost\r\n\r\n' > /dev/tcp/localhost/9000"
      timeout: 30s
      interval: 30s
      retries: 3
    image: quay.io/keycloak/keycloak:26.0.0@sha256:db0d0f2c2eee8618a37a50e04affb69823e56687b4d1b676a847a4b85de62178
    volumes:
      - type: bind
        source: ./files/microcks-realm-sample.json
        target: /opt/keycloak/data/import/microcks-realm.json
  mongodb:
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MONGODB_REPLICA_SET_MODE: primary
    image: mongo:7.0@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
    tmpfs:
      - /data/db
  postman:
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/health
      timeout: 30s
      interval: 30s
      retries: 3
    image: quay.io/microcks/microcks-postman-runtime:0.6.0@sha256:9788a8d88b61339e0cd972e028e5159c57669f09e360baf4ad490ba412ae34c7
  sut-microcks:
    environment:
      AUTH_PORT: "8081"
    image: webfuzzing/wfd-microcks:FINAL@sha256:43e2ab6170caf17cda2d25c5e8304a1b2aacfa73593202fc82c1fe090ac7a794
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::6300"
