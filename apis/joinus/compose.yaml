# JoinUs, imported from the Web Fuzzing Dataset by tools/import-wfd.py.
# Regenerate rather than edit: tools/import-wfd.py joinus
name: rd-joinus
x-dataset:
  id: joinus
  title: JoinUs
  origin:
    dataset: wfd
    repository: https://github.com/WebFuzzing/Dataset
    commit: b666555842a4547d46026349147a2b8159ee5835
    path: jdk_21_maven/cs/rest/joinus
  upstream:
    repository: https://github.com/KLAJDI16/joinUs
    license: not-known license
  language: jvm
  service: sut-joinus
  port: 8080
  document: openapi.json
  basePath: ""
  documentServedAt: /v3/api-docs
  ready: /v3/api-docs
  auth:
    file: auth.yaml
    user: wfd_admin
    server: null
  leaveAlone:
    - operation: logout
      why: ends the session the login opened
  coverage:
    kind: jacoco-tcpserver
    port: 6300
  platforms:
    - linux/amd64
    - linux/arm64
services:
  db:
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --eval \"db.adminCommand('ping')\""
      timeout: 30s
      interval: 30s
      retries: 3
    image: mongo:7@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
    volumes:
      - type: bind
        source: ./files/joinus-mongo-seed.js
        target: /docker-entrypoint-initdb.d/joinus-mongo-seed.js
  neo4j:
    command:
      - bash
      - -c
      - "/startup/docker-entrypoint.sh neo4j & pid=$$!; until cypher-shell -u neo4j -p wfdNeo4jPass123 \"RETURN 1\" >/dev/null 2>&1; do sleep 2; done; cypher-shell -u neo4j -p wfdNeo4jPass123 -f /seed.cypher; cypher-shell -u neo4j -p wfdNeo4jPass123 \"CREATE (:WfdSeedComplete)\"; wait "
    environment:
      NEO4J_AUTH: neo4j/wfdNeo4jPass123
    healthcheck:
      test:
        - CMD-SHELL
        - "cypher-shell -u neo4j -p wfdNeo4jPass123 \"MATCH (:WfdSeedComplete) RETURN 1\""
      timeout: 30s
      interval: 30s
      retries: 3
    image: neo4j:5.26@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
    volumes:
      - type: bind
        source: ./files/joinus-neo4j-seed.cypher
        target: /seed.cypher
  sut-joinus:
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      AUTH_PORT: "8081"
    image: webfuzzing/wfd-joinus:FINAL@sha256:3e26540ee2b76907c885ab34e45990071bcea4d608edf3e531cd89198c801757
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::6300"
